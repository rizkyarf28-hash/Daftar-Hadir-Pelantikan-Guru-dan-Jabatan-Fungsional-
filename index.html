<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touring Radar - Presensi & Panel Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Touring Radar - Absensi</a>
            <div class="navbar-nav ms-auto">
                <button class="btn btn-outline-light btn-sm me-2" onclick="switchTab('form')">Form Absensi</button>
                <button class="btn btn-outline-warning btn-sm" onclick="switchTab('admin')">Panel Admin</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        
        <!-- TAB 1: FORM ABSENSI -->
        <div id="section-form" class="card shadow p-4">
            <h3 class="mb-4">Form Kehadiran Peserta</h3>
            <form id="attendanceForm" onsubmit="submitForm(event)">
                <div class="mb-3">
                    <label class="form-label">Nomor Induk Pegawai (NIP)</label>
                    <input type="text" id="nip" class="form-control" placeholder="Ketik NIP atau isi manual jika belum terdaftar" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nama Lengkap & Gelar</label>
                    <input type="text" id="nama" class="form-control" placeholder="Ketik nama lengkap" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Jabatan</label>
                        <input type="text" id="jabatan" class="form-control" placeholder="Ketik jabatan">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Unit Kerja</label>
                        <input type="text" id="unit_kerja" class="form-control" placeholder="Ketik unit kerja">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Keterangan Kehadiran:</label>
                    <select id="keterangan" class="form-select" required>
                        <option value="Hadir">Hadir</option>
                        <option value="Izin">Izin</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100" id="submitBtn">Kirim Kehadiran</button>
            </form>
            <div id="formAlert" class="mt-3"></div>
        </div>

        <!-- TAB 2: PANEL ADMIN -->
        <div id="section-admin" class="card shadow p-4 d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Panel Admin - Data Kehadiran Real-Time</h3>
                <button class="btn btn-primary" onclick="loadAdminData()">Tarik Data Terbaru</button>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped" id="adminTable">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>Waktu</th>
                            <th>NIP</th>
                            <th>Nama Lengkap</th>
                            <th>Jabatan</th>
                            <th>Unit Kerja</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr><td colspan="7" class="text-center">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Utama -->
    <script>
        // Masukkan URL Web App Google Apps Script Anda di sini
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbznH1M8_KYm2Y9Owf7QaLqS7uR3n3e9VZO_xJCebBuHLyCNaQIkMuZBDIsZanvQ5Du2/exec";

        function switchTab(tab) {
            if (tab === 'form') {
                document.getElementById('section-form').classList.remove('d-none');
                document.getElementById('section-admin').classList.add('d-none');
            } else {
                document.getElementById('section-form').classList.add('d-none');
                document.getElementById('section-admin').classList.remove('d-none');
                loadAdminData(); // Otomatis tarik data saat masuk menu admin
            }
        }

        function submitForm(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('formAlert');
            
            btn.disabled = true;
            btn.innerText = "Mengirim...";
            alertBox.innerHTML = "";

            const payload = {
                nip: document.getElementById('nip').value,
                nama: document.getElementById('nama').value,
                jabatan: document.getElementById('jabatan').value,
                unit_kerja: document.getElementById('unit_kerja').value,
                keterangan: document.getElementById('keterangan').value
            };

            // Mengirim data ke Google Apps Script (menggunakan mode no-cors jika diperlukan atau fetch standar)
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alertBox.innerHTML = `<div class="alert alert-success">Kehadiran berhasil dikirim!</div>`;
                document.getElementById('attendanceForm').reset();
                btn.disabled = false;
                btn.innerText = "Kirim Kehadiran";
            })
            .catch(error => {
                console.error('Error:', error);
                alertBox.innerHTML = `<div class="alert alert-danger">Gagal mengirim data. Silakan coba lagi.</div>`;
                btn.disabled = false;
                btn.innerText = "Kirim Kehadiran";
            });
        }

        function loadAdminData() {
            let tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = `<tr><td colspan="7" class="text-center">Menarik data dari server...</td></tr>`;

            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = "";
                    
                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" class="text-center">Belum ada data masuk.</td></tr>`;
                        return;
                    }
                    
                    data.forEach((row, index) => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.timestamp ? new Date(row.timestamp).toLocaleString('id-ID') : '-'}</td>
                            <td>${row.nip || '-'}</td>
                            <td>${row.nama || '-'}</td>
                            <td>${row.jabatan || '-'}</td>
                            <td>${row.unit_kerja || '-'}</td>
                            <td><span class="badge bg-success">${row.keterangan || '-'}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error("Gagal menarik data:", error);
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Gagal memuat data / Format JSON tidak valid.</td></tr>`;
                });
        }
    </script>
</body>
</html>
